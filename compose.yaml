services:
  postgres:
    image: postgres:17
    container_name: jobsfindai-postgres

    environment:
      POSTGRES_DB: jobsfindai
      POSTGRES_USER: jobsfindai
      POSTGRES_PASSWORD: local_dev_password

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: